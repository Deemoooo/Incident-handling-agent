apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceName | quote }}
  labels:
    app: {{ .Values.serviceName | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.serviceName | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName | quote }}
    spec:
      containers:
        - name: {{ .Values.serviceName | quote }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources: 
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: SERVICE_NAME
              value: {{ .Values.serviceName | quote }}
            - name: DOWNSTREAM_URL
              value: {{ .Values.downstreamUrl | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
