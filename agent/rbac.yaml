apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-agent
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-agent-readonly
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-agent-readonly
  namespace: demo
roleRef:
  kind: Role
  name: incident-agent-readonly
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: incident-agent
    namespace: demo
